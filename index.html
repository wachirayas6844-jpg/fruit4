<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ AI Image Checker สุดคิ้วท์ ✨</title>
    <!-- นำเข้าฟอนต์ภาษาไทยน่ารักๆ จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            /* พื้นหลังไล่เฉดสีพาสเทลหวานละมุน */
            background: linear-gradient(135deg, #ffeef8 0%, #fff5eb 50%, #f3e8ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #5c4b51;
        }

        /* กล่องการ์ดหลักตรงกลาง */
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 440px;
            border-radius: 30px;
            padding: 35px 30px;
            box-shadow: 0 15px 35px rgba(255, 133, 162, 0.18);
            border: 2px solid #ffffff;
            text-align: center;
            transition: transform 0.3s ease;
        }

        h2 {
            color: #ff6b9d;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: #9e8a92;
            margin-bottom: 24px;
        }

        /* ซ่อนปุ่ม input เดิมที่ดูแข็งทื่อ */
        input[type="file"] {
            display: none;
        }

        /* ปุ่มอัปโหลดรูปสุดน่ารัก */
        .upload-btn {
            display: inline-block;
            background: linear-gradient(45deg, #ff85a2, #ff6b9d);
            color: white;
            padding: 13px 28px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 107, 157, 0.35);
            transition: all 0.25s ease;
        }

        .upload-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 107, 157, 0.45);
        }

        .upload-btn:active {
            transform: translateY(0);
        }

        /* กรอบแสดงรูปภาพตัวอย่าง */
        #image-container {
            margin: 22px auto 0;
            width: 220px;
            height: 220px;
            border-radius: 24px;
            border: 3px dashed #ffc2d4;
            background-color: #fff9fb;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #placeholder-text {
            color: #d4a5b5;
            font-size: 13px;
            padding: 15px;
        }

        #previewImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* กล่องสรุปผลลัพธ์หลัก */
        #resultSummary {
            display: none;
            margin-top: 22px;
            padding: 15px 20px;
            background: linear-gradient(135deg, #fff0f5, #ffe4ec);
            border: 2px solid #ffb3c6;
            border-radius: 20px;
            color: #d6336c;
            font-size: 18px;
            font-weight: 600;
            box-shadow: 0 6px 15px rgba(255, 179, 198, 0.25);
            animation: popIn 0.4s ease;
        }

        /* รายละเอียดเปอร์เซ็นต์ทั้งหมดแบบมีแถบหลอดพลัง */
        #label-container {
            margin-top: 20px;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .prediction-item {
            background: #fffafb;
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid #ffe3ec;
        }

        .prediction-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #6d5960;
        }

        .progress-bg {
            width: 100%;
            height: 8px;
            background-color: #ffe3ec;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff9ebb, #ff6b9d);
            border-radius: 10px;
            width: 0%;
            transition: width 0.5s ease-out;
        }

        /* อนิเมชันเด้งดึ๋งน่ารักๆ */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🌸 AI เช็กรูปภาพสุดคิ้วท์ 🌸</h2>
        <p class="subtitle">เลือกรูปภาพที่ต้องการให้น้อง AI ช่วยดูได้เลยค่า~</p>

        <!-- ปุ่มอัปโหลดที่ตกแต่งใหม่ -->
        <label for="imageInput" class="upload-btn">
            📸 เลือกรูปภาพตรงนี้เลย
        </label>
        <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)">

        <!-- กรอบแสดงรูปภาพ -->
        <div id="image-container">
            <span id="placeholder-text">ยังไม่มีรูปภาพเลย<br>กดปุ่มด้านบนเพื่อเลือกนะ ✨</span>
            <img id="previewImage" />
        </div>

        <!-- กล่องสรุปผลลัพธ์ -->
        <div id="resultSummary"></div>

        <!-- รายการเปอร์เซ็นต์แต่ละคลาส -->
        <div id="label-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script type="text/javascript">
        const URL = "./my_model/";

        let model, labelContainer, maxPredictions;

        // โหลดโมเดลล่วงหน้า
        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = ""; // เคลียร์ค่าเริ่มต้น

            for (let i = 0; i < maxPredictions; i++) {
                const itemDiv = document.createElement("div");
                itemDiv.className = "prediction-item";
                itemDiv.innerHTML = `
                    <div class="prediction-header">
                        <span class="class-name">กำลังรอรูปภาพ...</span>
                        <span class="class-percent">0%</span>
                    </div>
                    <div class="progress-bg">
                        <div class="progress-fill"></div>
                    </div>
                `;
                labelContainer.appendChild(itemDiv);
            }
        }
        
        init();

        // ฟังก์ชันจัดการรูปภาพที่อัปโหลด
        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const imageElement = document.getElementById("previewImage");
            const placeholder = document.getElementById("placeholder-text");
            const summaryDiv = document.getElementById("resultSummary");

            imageElement.src = URL.createObjectURL(file);
            imageElement.style.display = "block";
            placeholder.style.display = "none";

            summaryDiv.style.display = "block";
            summaryDiv.innerHTML = "🎀 กำลังวิเคราะห์รูปภาพน้า รอแป๊บนึง...";

            imageElement.onload = async function() {
                const prediction = await model.predict(imageElement);
                
                let highestProbability = 0;
                let bestClassName = "";

                for (let i = 0; i < maxPredictions; i++) {
                    const prob = prediction[i].probability;
                    const className = prediction[i].className;
                    const percent = (prob * 100).toFixed(1);

                    // อัปเดตชื่อคลาส เปอร์เซ็นต์ และความยาวหลอดพลัง
                    const itemDiv = labelContainer.childNodes[i];
                    itemDiv.querySelector(".class-name").innerText = className;
                    itemDiv.querySelector(".class-percent").innerText = `${percent}%`;
                    itemDiv.querySelector(".progress-fill").style.width = `${percent}%`;

                    if (prob > highestProbability) {
                        highestProbability = prob;
                        bestClassName = className;
                    }
                }

                // แสดงผลสรุปสุดน่ารัก
                summaryDiv.innerHTML = `💖 สรุปแล้วน้องคือ: <u>${bestClassName}</u> (${(highestProbability * 100).toFixed(1)}%)`;
            }
        }
    </script>
</body>
</html>
